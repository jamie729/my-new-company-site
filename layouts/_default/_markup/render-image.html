{{ $src := .Destination }}
{{ $alt := .Text | safeHTML }}
{{ $title := .Title | safeHTMLAttr }}

<figure class="post-figure custom-md-figure" style="margin: 1.5em 0; text-align: center;">
  {{ if strings.HasPrefix $src "/" }}
    {{/* 增加了 display: block 和 margin: 0 auto 确保下方没有空隙 */}}
    <img src="{{ $src }}" alt="{{ $alt }}" title="{{ $title }}" class="post-image" loading="lazy" style="display: block; margin: 0 auto; max-width: 100%;" />
  {{ else }}
    {{ $res := .Page.Resources.GetMatch (printf "**%s" $src) }}
    {{ if $res }}
      {{ $ext := lower (path.Ext $src) }}
      {{ if or (eq $ext ".mp4") (eq $ext ".webm") (eq $ext ".ogg") }}
        <video src="{{ $res.RelPermalink }}" title="{{ $title }}" class="post-video" controls preload="metadata" style="width: 100%; display: block;">
          您的浏览器不支持视频播放。
        </video>
      {{ else }}
        {{ $small := $res.Resize "600x" }}
        {{ $large := $res.Resize "1024x" }}
        <img src="{{ $large.RelPermalink }}" srcset="{{ $small.RelPermalink }} 600w, {{ $large.RelPermalink }} 1024w" sizes="(max-width:1024px) 100vw, 1024px" alt="{{ $alt }}" title="{{ $title }}" class="post-image" loading="lazy" style="display: block; margin: 0 auto; max-width: 100%;" />
      {{ end }}
    {{ else }}
      <img src="{{ $src }}" alt="{{ $alt }}" title="{{ $title }}" class="post-image" loading="lazy" style="display: block; margin: 0 auto; max-width: 100%;" />
    {{ end }}
  {{ end }}

  {{/* 修改重点：减小 margin-top */}}
  {{ if .Text }}
    <figcaption class="post-image-caption">
      {{ .Text | safeHTML }}
    </figcaption>
  {{ end }}
</figure>

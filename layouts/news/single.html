{{define "main"}}
<article class="post">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 mx-auto">
        <div class="post-title">
          <h2>{{.Title}}</h2>
        </div>
        <div class="post-meta">
          <p><span>{{ .PublishDate.Format "2006年1月2日 15:04" }}</span> in 
            {{ range (.GetTerms "tags") }}
              <a class="tags" href="{{ .Permalink }}">{{ .LinkTitle }}</a>
            {{ end }}
          </p>
        </div>
        <div class="post-image">
          {{ $featureImage := .Params.featureImage }}
          {{ $res := .Resources.GetMatch $featureImage }}
          {{ if $res }}
            <img src="{{ $res.RelPermalink }}" alt="feature-image">
          {{ else }}
            <img src="{{ $featureImage | absURL }}" alt="feature-image">
          {{ end }}
        </div>
        <div class="post-body">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</article>
{{end}}
